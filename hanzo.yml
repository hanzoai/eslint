# Canonical CI/CD config for hanzoai/eslint — read by hanzoai/ci (via
# .hanzo/workflows/cicd.yml) and by platform.hanzo.ai.
#
# Library (npm). The gate is `npm run lint` — which is eslint linting its own
# lib/, tools/ and tests/ with the rules it ships. That is not a style check
# here: it runs the built linter over thousands of files, so a broken rule, a
# broken config resolution or a broken parser path fails it. Dogfooding is this
# repo's real gate and its own ci.yml runs it first for the same reason.
#
# `node Makefile.js test` (the full mocha suite, every rule, every fixture) is
# a 20-minute run and is not what a per-push gate should be.
#
# `npm install`, not `npm ci`: this repo does not commit a lockfile.
test:
  - name: lint
    run: npm install --no-audit --no-fund && npm run lint
